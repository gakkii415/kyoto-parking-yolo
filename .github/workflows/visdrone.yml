name: Evaluate VisDrone YOLO
on:
  push:
    branches: [build/yolo-app]
    paths: ['.github/workflows/visdrone.yml']
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.203 onnx==1.17.0 onnxruntime==1.20.1
      - run: |
          python - <<'PY'
          import runpy,json,shutil,requests
          from pathlib import Path
          import numpy as np,cv2
          from PIL import Image,ImageDraw
          from ultralytics import YOLO
          import onnxruntime as ort
          env=runpy.run_path('tools/prepare.py');out=Path('visdrone');out.mkdir(exist_ok=True)
          sites=[{'id':'nishikyogoku','name':'西京極運動公園周辺','district':'京都市右京区','lat':34.9923,'lon':135.7120,'roi':[[0,0],[1,0],[1,1],[0,1]]}]
          for site in sites:env['mosaic'](site)
          reports=[]
          for variant in ['n','s']:
            repo='dronefreak/visdrone-yolov8'+variant
            info=requests.get('https://huggingface.co/api/models/'+repo,timeout=30).json();revision=info['sha']
            weights=out/f'visdrone-{variant}.pt';weights.write_bytes(env['get']('https://huggingface.co/'+repo+'/resolve/'+revision+'/best.pt'))
            model=YOLO(str(weights));names=model.names;ids=[k for k,v in names.items() if v in ('car','van','truck','bus')]
            assert len(ids)==4,names
            file=model.export(format='onnx',imgsz=640,opset=17,simplify=False,dynamic=False,batch=1,device='cpu')
            session=ort.InferenceSession(file,providers=['CPUExecutionProvider'])
            for site in ['katsuragawa','icc','nishikyogoku']:
              im=Image.open('_site/assets/'+site+'-seamlessphoto.jpg').convert('RGB')
              for tile in [192,384]:
                candidates=[];boxes=[];scores=[]
                for y in env['offsets'](im.height,tile):
                  for x in env['offsets'](im.width,tile):
                    crop=np.asarray(im)[y:y+tile,x:x+tile];inp=cv2.resize(crop,(640,640)).transpose(2,0,1)[None].astype(np.float32)/255
                    a=session.run(None,{'images':np.ascontiguousarray(inp)})[0][0];sc=a[4:];cls=sc.argmax(0);best=sc.max(0)
                    for i in np.where((best>=.08)&np.isin(cls,ids))[0]:
                      cx,cy,w,h=map(float,a[:4,i]/(640/tile));b={'cx':cx+x,'cy':cy+y,'w':w,'h':h,'angle':0,'score':float(best[i]),'classId':int(cls[i])};candidates.append(b);boxes.append([b['cx']-w/2,b['cy']-h/2,w,h]);scores.append(b['score'])
                keep=cv2.dnn.NMSBoxes(boxes,scores,.08,.3) if boxes else []
                detections=[candidates[int(i)] for i in np.array(keep).flatten()]
                record={'model':repo,'revision':revision,'file':str(file),'names':names,'vehicleIds':ids,'tile':tile,'site':site,'detections':detections,'count25':sum(b['score']>=.25 for b in detections)}
                reports.append(record);print(repo,site,tile,record['count25'],flush=True)
                annotated=im.copy();draw=ImageDraw.Draw(annotated)
                for b in detections:
                  if b['score']>=.25:draw.rectangle([b['cx']-b['w']/2,b['cy']-b['h']/2,b['cx']+b['w']/2,b['cy']+b['h']/2],outline='#c0f27b',width=2)
                annotated.save(out/f'{variant}-{site}-{tile}.jpg')
          (out/'results.json').write_text(json.dumps(reports,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visdrone-evaluation
          path: visdrone
          retention-days: 3
