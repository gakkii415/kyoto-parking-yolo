name: Verify published parking app in browser
on:
  push:
    branches: [qa/pages-browser-v1]
    paths:
      - scripts/browser-smoke.mjs
      - .github/workflows/verify-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            browser-check.json
            mobile-result.png
            browser-failure.png
          retention-days: 7
