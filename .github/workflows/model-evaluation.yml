name: Evaluate aerial models
on:
  push:
    branches: [build/yolo-app]
    paths: ['.github/workflows/model-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.203 onnx==1.17.0 onnxruntime==1.20.1
      - name: Compare official models on the same real image
        run: |
          python - <<'PY'
          import runpy,json,shutil
          from pathlib import Path
          from PIL import Image
          from ultralytics import YOLO
          import onnxruntime as ort
          env=runpy.run_path('tools/prepare.py')
          result=[];out=Path('_site/alternatives');out.mkdir(exist_ok=True)
          for model_name in ['yolov8n-obb','yolo11s-obb']:
            model=YOLO(model_name+'.pt')
            file=model.export(format='onnx',imgsz=640,opset=17,simplify=False,dynamic=False,batch=1,device='cpu')
            shutil.copy2(file,out/(model_name+'.onnx'))
            session=ort.InferenceSession(file,providers=['CPUExecutionProvider'])
            env['infer'].__globals__['session']=session
            names={int(k):v.replace(' ','-') for k,v in model.names.items()}
            vids=[k for k,v in names.items() if v in ('small-vehicle','large-vehicle')]
            env['infer'].__globals__['classes']=names;env['infer'].__globals__['vehicle_ids']=vids
            for tile in [192,256,384]:
              im=Image.open('_site/assets/katsuragawa-seamlessphoto.jpg').convert('RGB')
              boxes,maxima=env['infer'](im,tile=tile)
              record={'model':model_name,'tile':tile,'names':names,'count25':sum(b['score']>=.25 for b in boxes),'boxes':boxes,'maxima':maxima}
              result.append(record)
              print(model_name,tile,record['count25'],maxima,flush=True)
          (out/'evaluation.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation
          path: _site
          retention-days: 3
